name: Compressly Android Build

on:
  push:
    branches: [ compressly-ci-build ]
    paths:
      - 'compressly-ci/**'
      - '.github/workflows/compressly-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct project archive
        shell: bash
        run: |
          cat compressly-ci/chunk_*.txt | tr -d '\n\r ' | base64 -d > compressly-ci-min.zip
          unzip -q compressly-ci-min.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK 36
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build APK and AAB
        run: gradle -p compressly_ci_min --no-daemon clean assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: compressly-builds
          if-no-files-found: error
          path: |
            compressly_ci_min/app/build/outputs/apk/debug/*.apk
            compressly_ci_min/app/build/outputs/bundle/release/*.aab
